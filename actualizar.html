<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar pedido - FarmaSalud Perú</title>
    <link rel="stylesheet" href="css/actualizar.css">
</head>
<body>
    <input type="checkbox" id="check-confirmacion">
    <header>
        <div class="logo">
            <img src="img/cruz-logo.jpg" alt="Logo Cruz" class="cruz-img">
            <h1>FarmaSalud Perú</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="registro.html">Delivery</a></li>
                <li><a href="consulta.html">Mis pedidos</a></li>
                <li><div id="auth-container"><a href="login.html" class="btn-login-header">Iniciar Sesión</a></div></li>
            </ul>
        </nav>
    </header>

    <main class="main-container">
        <section class="content-section">
            <h2>Editar mi pedido</h2>
            <p id="aviso-actualizar"></p>
            <form id="form-actualizar">
                <fieldset>
                    <legend>Datos del pedido <strong id="codigo-pedido"></strong></legend>
                    <label for="act-nombre">Nombre Completo:</label>
                    <input type="text" id="act-nombre" required>
                    <label for="act-direccion">Dirección de Entrega:</label>
                    <input type="text" id="act-direccion" required>
                    <button type="submit" id="btn-guardar" class="btn-delivery">Guardar cambios</button>
                </fieldset>
            </form>
            <div class="mensaje-confirmacion">✔ ¡Pedido actualizado correctamente!</div>
            <p><a href="consulta.html" class="btn-delivery">Volver a Mis pedidos</a></p>
        </section>
    </main>

    <script type="module" src="js/actualizar/actualizar.js"></script>
</body>
</html>
